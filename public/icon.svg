<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dalil">
  <defs>
    <linearGradient id="dalil-shell" x1="118" y1="420" x2="410" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0759ff"/>
      <stop offset=".46" stop-color="#0b91ff"/>
      <stop offset="1" stop-color="#29f1ff"/>
    </linearGradient>
    <linearGradient id="dalil-swoosh" x1="150" y1="420" x2="306" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0870ff"/>
      <stop offset=".55" stop-color="#16b7ff"/>
      <stop offset="1" stop-color="#8ffaff"/>
    </linearGradient>
    <radialGradient id="dalil-glow" cx="0" cy="0" r="1" gradientTransform="translate(282 256) rotate(90) scale(44)">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".24" stop-color="#b9fbff"/>
      <stop offset=".6" stop-color="#22d7ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00b8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="dalil-needle-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#050b14"/>

  <!-- Outer D: smooth cap, bowl and base -->
  <path
    d="M146 84H274
       C376 84 438 154 438 256
       C438 358 376 428 274 428
       H146"
    fill="none"
    stroke="url(#dalil-shell)"
    stroke-width="58"
    stroke-linejoin="round"
    stroke-linecap="butt"
  />

  <!-- Left separated pillar from the original mark -->
  <path
    d="M146 130
       L186 171
       V244
       L146 292
       Z"
    fill="url(#dalil-shell)"
  />

  <!-- Inner rising blade / swoosh -->
  <path
    d="M146 428
       V354
       C171 329 204 300 239 275
       C259 260 281 247 305 236
       C280 268 257 299 237 331
       C226 349 218 363 222 375
       C226 388 239 393 258 393
       H278"
    fill="url(#dalil-swoosh)"
  />

  <!-- Radar -->
  <g fill="none" stroke-linecap="round">
    <circle cx="282" cy="256" r="48" stroke="#26e6ff" stroke-width="6.5" opacity=".95"/>
    <circle cx="282" cy="256" r="82" stroke="#148cff" stroke-width="6" opacity=".78"/>
    <circle cx="282" cy="256" r="116" stroke="#0759ff" stroke-width="5.5" opacity=".58"/>
  </g>

  <!-- Needle -->
  <path
    d="M282 256 L365 173"
    stroke="#a8fbff"
    stroke-width="8"
    stroke-linecap="round"
    filter="url(#dalil-needle-glow)"
  />

  <circle cx="282" cy="256" r="44" fill="url(#dalil-glow)"/>
  <circle cx="282" cy="256" r="10" fill="#ecfeff"/>
</svg>
