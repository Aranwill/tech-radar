name: GitHub repository snapshots

on:
  workflow_dispatch:
    inputs:
      persist:
        description: Persistir el snapshot en D1
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: github-repository-snapshots
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.DALIL_SNAPSHOTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate snapshot persistence contract
        run: node scripts/validate-github-snapshot-pipeline.mjs

      - name: Reject production persistence outside main
        if: github.event_name == 'workflow_dispatch' && inputs.persist == true && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::La persistencia D1 manual sólo está permitida desde refs/heads/main."
          exit 1

      - name: Collect GitHub snapshot (manual dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.persist != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-snapshot.mjs --manual

      - name: Persist GitHub snapshot (manual main)
        if: github.event_name == 'workflow_dispatch' && inputs.persist == true && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: node scripts/github-snapshot.mjs --manual --persist

      - name: Persist GitHub snapshot (scheduled)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: node scripts/github-snapshot.mjs --scheduled --persist
