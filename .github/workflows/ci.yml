name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security baseline
        run: pnpm security:baseline

      - name: Validate D1 schema
        run: pnpm schema:validate

      - name: Validate D1 runtime configuration contract
        run: pnpm d1:config:validate

      - name: Validate D1 remote verifier syntax
        run: pnpm d1:verify:syntax

      - name: Validate GitHub snapshot pipeline
        run: pnpm snapshot:validate

      - name: Validate GitHub history
        run: pnpm history:validate

      - name: Validate bounded external JSON
        run: pnpm http:bounded-json:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Next.js baseline
        run: pnpm build

      - name: Build Cloudflare / vinext runtime
        run: pnpm build:vinext

      - name: Smoke test Cloudflare / vinext runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pnpm start:vinext --host 127.0.0.1 --port 4173 > /tmp/dalil-vinext.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/dalil-root.html; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat /tmp/dalil-vinext.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error --dump-header /tmp/dalil-headers.txt \
            --output /tmp/dalil-root.html \
            http://127.0.0.1:4173/

          grep -qi '^content-security-policy:' /tmp/dalil-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/dalil-headers.txt
          grep -qi '^permissions-policy:.*geolocation=()' /tmp/dalil-headers.txt

          curl --fail --silent --show-error \
            --header 'Accept: application/json' \
            http://127.0.0.1:4173/api/github/repositories \
            --output /tmp/dalil-github.json

          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";

          const payload = JSON.parse(readFileSync("/tmp/dalil-github.json", "utf8"));
          const names = payload.repositories?.map((repository) => repository.name).sort();

          const expected = [
            "a2ui-project/a2ui",
            "huggingface/transformers",
            "modelcontextprotocol/ext-apps",
          ].sort();

          if (
            JSON.stringify(names) !== JSON.stringify(expected) ||
            typeof payload.partial !== "boolean" ||
            typeof payload.servedAt !== "string"
          ) {
            throw new Error("Runtime GitHub API contract mismatch.");
          }
          NODE

      - name: Audit dependency graph
        run: pnpm audit --audit-level=moderate
