name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security baseline
        run: pnpm security:baseline

      - name: Validate D1 schema
        run: pnpm schema:validate

      - name: Validate D1 runtime configuration contract
        run: pnpm d1:config:validate

      - name: Validate D1 remote verifier syntax
        run: pnpm d1:verify:syntax

      - name: Validate GitHub snapshot pipeline
        run: pnpm snapshot:validate

      - name: Validate GitHub history
        run: pnpm history:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Audit dependency supply chain
        shell: bash
        run: |
          set +e

          echo "::group::Runtime dependencies · moderate+"
          pnpm audit --prod --audit-level=moderate
          runtime_status=$?
          echo "::endgroup::"

          echo "::group::Full dependency tree · high+"
          pnpm audit --audit-level=high
          full_status=$?
          echo "::endgroup::"

          set -e

          if [[ "$runtime_status" -ne 0 || "$full_status" -ne 0 ]]; then
            echo "::error::Dependency audit failed. No advisory is ignored automatically."
            exit 1
          fi
