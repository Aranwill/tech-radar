name: Cloudflare compatibility preflight

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-compat.yml"
      - "cloudflare.config.ts"
      - "docs/CLOUDFLARE_COMPATIBILITY_PREFLIGHT.md"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vite.config.ts"
      - "src/**"
      - "public/**"

permissions:
  contents: read

concurrency:
  group: cloudflare-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vinext-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vinext compatibility check
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec vinext check 2>&1 | tee vinext-check.txt

          {
            printf '%s\n' '## Cloudflare / vinext compatibility preflight'
            printf '\n'
            printf '%s\n' '`vinext check` executed from the lockfile-installed project dependency.'
            printf '\n'
            printf '%s\n' '```text'
            cat vinext-check.txt
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q "✗" vinext-check.txt; then
            echo "::error::vinext check reported one or more compatibility issues."
            exit 1
          fi

      - name: Build vinext Worker
        run: pnpm build:vinext

      - name: Smoke-test runtime security headers
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > vinext-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..30}; do
            if curl --silent --show-error --fail               --dump-header response-headers.txt               --output /dev/null               http://127.0.0.1:4173/; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat vinext-preview.log
            echo "::error::vinext preview did not become ready."
            exit 1
          fi

          for header in             "content-security-policy"             "referrer-policy"             "x-content-type-options"             "permissions-policy"             "cross-origin-opener-policy"; do
            if ! grep -qi "^$header:" response-headers.txt; then
              cat response-headers.txt
              echo "::error::Missing runtime security header: $header"
              exit 1
            fi
          done

          if grep -qi "^x-powered-by:" response-headers.txt; then
            cat response-headers.txt
            echo "::error::X-Powered-By must not be exposed."
            exit 1
          fi

          if ! grep -qi "permissions-policy:.*geolocation=()" response-headers.txt; then
            cat response-headers.txt
            echo "::error::Geolocation must remain disabled until an explicit feature gate exists."
            exit 1
          fi

          if ! grep -qi "content-security-policy:.*connect-src 'self'" response-headers.txt; then
            cat response-headers.txt
            echo "::error::Production connect-src must default to self only."
            exit 1
          fi
