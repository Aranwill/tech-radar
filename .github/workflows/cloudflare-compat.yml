name: Cloudflare compatibility preflight

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-compat.yml"
      - "docs/CLOUDFLARE_COMPATIBILITY_PREFLIGHT.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "src/**"
      - "public/**"

permissions:
  contents: read

concurrency:
  group: cloudflare-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vinext compatibility check
        shell: bash
        run: |
          set -euo pipefail

          pnpm dlx vinext@1.0.1 check 2>&1 | tee vinext-check.txt

          {
            printf '%s\n' '## Cloudflare / vinext compatibility preflight'
            printf '\n'
            printf '%s\n' '`vinext check` pinned to 1.0.1 for this evidence run.'
            printf '\n'
            printf '%s\n' '```text'
            cat vinext-check.txt
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q "✗" vinext-check.txt; then
            echo "::error::vinext check reported one or more compatibility issues."
            exit 1
          fi
