packages:
  - "."

# Reduce el riesgo de adoptar una versión recién publicada antes de que
# exista tiempo razonable para que la comunidad/registro detecten incidentes.
minimumReleaseAge: 1440

# Evita que dependencias transitivas obtengan código desde Git/tarballs
# externos al registry configurado.
blockExoticSubdeps: true

# Las nuevas dependencias directas se guardan con versión exacta.
saveExact: true

# Backport de seguridad compatible para una transitiva fijada por Satori/OpenType.
# El override se retira cuando los parents publiquen una versión que ya lo incluya.
overrides:
  fflate: 0.7.5

audit:
  level: moderate

# Único script de instalación aprobado actualmente. Cualquier ampliación
# requiere revisión explícita del paquete y de su necesidad.
allowBuilds:
  workerd: true
